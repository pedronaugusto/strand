name: Manual indicative observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 857565788e597fdf91a82505349e9dc95b81ecd8
          path: .zig-cache/previous-main
          sparse-checkout: src
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: e80b9a631956b1b7b7a7c6ebc69ec7e495ad623d
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - name: Compile paired manual observations without timing
        run: zig build baseline-build core-bench-build s2-bench-build size-current-build size-previous-build -Dbaseline-source=.zig-cache/previous-main/src/strand.zig
      - name: Record compiler and provenance in the CI run
        run: |
          mkdir -p "$RUNNER_TEMP/strand-observation"
          zig env
          uname -a
          git rev-parse HEAD
          git -C .zig-cache/previous-main rev-parse HEAD
      - name: Linux CPU and memory
        if: runner.os == 'Linux'
        run: |
          lscpu
          free -b
      - name: Windows CPU and memory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,Version
      - name: macOS CPU and memory
        if: runner.os == 'macOS'
        run: sysctl hw machdep.cpu
      - name: Explicit manual paired Linux timings
        if: runner.os == 'Linux'
        run: |
          taskset -c 0 ./zig-out/bin/strand-baseline "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/baseline.jsonl"
          taskset -c 0 ./zig-out/bin/strand-core-bench "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/core.jsonl"
          taskset -c 0 ./zig-out/bin/strand-s2-bench "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/s2.jsonl"
      - name: Explicit manual paired Windows timings
        if: runner.os == 'Windows'
        run: |
          ./zig-out/bin/strand-baseline.exe "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/baseline.jsonl"
          ./zig-out/bin/strand-core-bench.exe "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/core.jsonl"
          ./zig-out/bin/strand-s2-bench.exe "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/s2.jsonl"
      - name: Explicit manual paired macOS timings
        if: runner.os == 'macOS'
        run: |
          ./zig-out/bin/strand-baseline "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/baseline.jsonl"
          ./zig-out/bin/strand-core-bench "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/core.jsonl"
          ./zig-out/bin/strand-s2-bench "$GITHUB_SHA" > "$RUNNER_TEMP/strand-observation/s2.jsonl"
      - name: Identical legacy fixture size
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            size ./zig-out/bin/strand-size-current ./zig-out/bin/strand-size-previous > "$RUNNER_TEMP/strand-observation/size.txt"
          elif [ "$RUNNER_OS" = Linux ]; then
            size ./zig-out/bin/strand-size-current ./zig-out/bin/strand-size-previous > "$RUNNER_TEMP/strand-observation/size.txt"
          else
            wc -c ./zig-out/bin/strand-size-current.exe ./zig-out/bin/strand-size-previous.exe > "$RUNNER_TEMP/strand-observation/size.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strand-indicative-${{ runner.os }}
          path: ${{ runner.temp }}/strand-observation/*

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The whole suite on every supported host. Each optimize mode is its own
  # step so a failure names the mode it failed in: the safety checks that
  # catch a bad slice in Debug and ReleaseSafe are gone in ReleaseFast and
  # ReleaseSmall, and a package whose tests only ever run in one mode has
  # only ever been tested in one mode.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A follower waits for a file to grow, and a wait that has nothing to wait
    # for does not end on its own. This is what turns that into a failed run
    # rather than one that sits there.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # The suite under ThreadSanitizer. A follower's cancellation is a second
      # task ending a wait the first is in, and a race there is a claim a
      # detector can check and a reader cannot. Debug, because that is the mode
      # the detector instruments most completely. Linux only: Windows has no
      # runtime for it, and on the hosted macOS runner the instrumented suite is
      # killed by a segfault before its first test reports, while the same suite
      # passes under ThreadSanitizer on a Mac, where it is run before a release.
      - name: Test — ThreadSanitizer
        if: runner.os == 'Linux'
        run: zig build test -Dthread-sanitizer -Doptimize=Debug --test-timeout 120s

      # Built AND run: an example that only compiles proves the names still
      # resolve, and running it is what proves the code does what the text
      # around it says.
      - name: Examples
        run: zig build examples

  # The properties over generated input, rather than over the corpus and the
  # table alone. `zig build test --fuzz` is the other mode and runs until it
  # is stopped, which is not something a job can wait on; these rounds are
  # driven by a seed and end. ReleaseSafe, because the checks are half the
  # point and the speed is the other half.
  campaign:
    name: properties over generated input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=ReleaseSafe -Dcampaign=20000 --test-timeout 300s

  # README.md's Usage block against the example it is taken from. Cheap, needs
  # no compiler, so it is its own job.
  docs:
    name: generated blocks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-readme.sh

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources are portable; the `test` job above is what proves
  # behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}
